# Project info and tool settings only. Packages come from pacman, not pip
# (decision 2), so there are no dependency lists here.

[project]
name = "stellaris-patcher"
dynamic = ["version"]
description = "Builds patch mods for Stellaris playsets"
requires-python = ">=3.14"

[tool.setuptools.dynamic]
version = { attr = "stellaris_patcher.__version__" }

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tools/collection_background.py" = ["E501"]  # mostly an SVG template

[tool.mypy]
strict = true
mypy_path = ["src", "tests"]
files = ["src", "tests", "tools"]
explicit_package_bases = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["real_install: reads (never writes) the Stellaris install on this machine"]

# Runs `make check` on every pull request and on main (decision 36), in the CI image:
# Arch with the dev container's pacman packages (.github/ci/Dockerfile), so ruff, mypy
# and Python match. ci-image.yml builds it weekly.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # From GitHub's registry, with the repo's own token (decision 38, see ci-image.yml).
    container:
      image: ghcr.io/spritzen/stellaris-patcher-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # The real-install tests skip themselves: there's no Stellaris or Cold Steel here.
      - name: make check
        run: make check
